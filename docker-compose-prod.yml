services:
    app:
        build:
            context: ./backend/.
            dockerfile: Dockerfile
        working_dir: /opt/minmatar
        command: ./app-start.sh
        env_file:
            - .env
        ports:
            - "8020:8000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock

    bot:
        build:
            context: ./bot/.
            dockerfile: Dockerfile
        working_dir: /opt/bot
        command: python3 main.py
        env_file:
            - bot/.env

    beat:
        build:
            context: ./backend/.
            dockerfile: Dockerfile
        restart: always
        env_file: .env
        command: celery -A app beat -l info
        depends_on:
            - app

    celery:
        build:
            context: ./backend/.
            dockerfile: Dockerfile
        restart: always
        env_file: .env
        command: celery -A app worker -l info -Q celery
        deploy:
            mode: replicated
            replicas: 4
        depends_on:
            - app

    celery-eveonline:
        build:
            context: ./backend/.
            dockerfile: Dockerfile
        restart: always
        env_file: .env
        command: celery -A app worker -l info -Q eveonline
        deploy:
            mode: replicated
            replicas: 6
        depends_on:
            - app

    celery-market:
        build:
            context: ./backend/.
            dockerfile: Dockerfile
        restart: always
        env_file: .env
        command: celery -A app worker -l info -Q market
        deploy:
            mode: replicated
            replicas: 2
        depends_on:
            - app

    frontend:
        build:
            context: ./frontend/
            dockerfile: Dockerfile
            secrets:
                - frontend_env
        depends_on:
            - app
        environment:
            - ORIGIN=https://my.minmatar.org
        env_file:
            - frontend/.env
        ports:
            - "4321:4321"
        volumes:
            - "./frontend/app/src/data:/app/src/data"

    redis:
        image: redis:6.0.9-alpine
        volumes:
            - "redis:/var/lib/redis"
            - "redis:/data"

    metabase:
        image: metabase/metabase:latest
        ports:
        - 3000:3000
        env_file:
            - .env

secrets:
    frontend_env:
        file: ./frontend/.env

volumes:
    redis: {}
