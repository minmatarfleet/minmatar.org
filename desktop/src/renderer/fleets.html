<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.evetech.net; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="eve-window.css">
<link rel="stylesheet" href="fleets.css">
<link rel="stylesheet" href="fleet_view.css">
<title>Fleet</title>
</head>
<body class="is-hidden is-locked">
<section class="eve-window">
    <header class="eve-window__header fw-header" data-interactive>
        <img class="eve-window__icon" src="../assets/icon.png" alt="Minmatar Fleet">
        <nav class="fw-tabs" role="tablist" aria-label="Fleet window">
            <button role="tab" id="tab-fleet" data-tab="fleet" aria-selected="true"><span class="fw-tabs__dot" id="tab-fleet-dot" aria-hidden="true" hidden></span>Fleet</button>
            <button role="tab" id="tab-upcoming" data-tab="upcoming" aria-selected="false">Upcoming <span class="fw-tabs__count" id="tab-upcoming-count"></span></button>
            <button role="tab" id="tab-recent" data-tab="recent" aria-selected="false">Recent<span class="fw-tabs__owed" id="tab-recent-dot" title="SRP to file" hidden></span></button>
        </nav>
        <nav class="eve-window__controls">
            <button class="eve-icon-button" id="refresh" data-command="app:refresh" aria-label="Refresh" title="Refresh">
                <svg viewBox="0 0 12 12"><path d="M10 6a4 4 0 1 1-1.2-2.85M10 1.5v2.5H7.5"/></svg>
            </button>
            <button class="eve-icon-button" id="lock" data-command="lock:toggle" aria-label="Pin in place" aria-pressed="true" title="Pinned in place. Click to move and resize">
                <svg viewBox="0 0 12 12"><path d="M4.5 1.5h3l-.5 3 2 1.5H3l2-1.5zM6 6v4.5"/></svg>
            </button>
            <button class="eve-icon-button" data-command="settings:open" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="1.8"/><path d="M6 1v1.6M6 9.4V11M1 6h1.6M9.4 6H11M2.5 2.5l1.1 1.1M8.4 8.4l1.1 1.1M2.5 9.5l1.1-1.1M8.4 3.6l1.1-1.1"/></svg>
            </button>
            <button class="eve-icon-button" data-command="window:minimize" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg></button>
            <button class="eve-icon-button" data-command="window:close" aria-label="Close to tray" title="Close to tray"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
        </nav>
    </header>
    <div class="fw-strip-slot" id="strip" data-interactive></div>
    <main class="eve-window__body fw-main" id="view" data-interactive aria-live="polite"></main>
    <footer class="fw-foot" id="foot" data-interactive>
        <div class="fw-foot__actions" id="actions"></div>
        <div class="fw-foot__status" id="status"></div>
        <button class="fw-site" id="site" data-fleet-command="fleet:open-site" hidden>Open on site<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5l-7 7"/></svg></button>
    </footer>
    <div class="eve-resize" id="resize" data-interactive aria-hidden="true"></div>
</section>
<script src="eve_window.js"></script>
<script src="ui_helpers.js"></script>
<script src="fleet_format.js"></script>
<script src="fleet_view.js"></script>
<script src="fleets.js"></script>
</body>
</html>
