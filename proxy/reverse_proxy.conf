# Production nginx reverse proxy for minmatar.org (frontend :4321) and
# api.minmatar.org (Django :8000), with TLS from /etc/nginx/cert.
# Nothing in this repo mounts it: docker-compose-prod.yml does not run nginx,
# and the local compose proxy service was removed in January 2026. It is kept
# as the reference copy of the proxy on the production host; edit it when you
# change that proxy (e.g. client_max_body_size, raised to 10M in #840).

server {
    listen 80;
    listen 443 ssl;
    server_name minmatar.org;

    if ($scheme = http)
    {
      return 301 https://$server_name$request_uri;
    }
  
    ssl_certificate     /etc/nginx/cert/tls.crt;
    ssl_certificate_key /etc/nginx/cert/tls.key;
  
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Host   $server_name;
    proxy_set_header    X-Forwarded-Proto  $scheme;

    client_max_body_size 10M;

    location / {
      proxy_pass http://frontend:4321/;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.minmatar.org;

    if ($scheme = http)
    {
      return 301 https://$server_name$request_uri;
    }
  
    ssl_certificate     /etc/nginx/cert/tls.crt;
    ssl_certificate_key /etc/nginx/cert/tls.key;
  
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Host   $server_name;
    proxy_set_header    X-Forwarded-Proto  $scheme;
  
    client_max_body_size 10M;

    location / {
      proxy_pass          http://app:8000/;
    }
}