name: Technical debt
description: Cleanup, refactor, upgrade or tooling. Nothing pilots should notice.
labels: ["tech-debt"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow, risky or duplicated today, and what it costs us.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, and how we know nothing pilots see changed.
    validations:
      required: true
