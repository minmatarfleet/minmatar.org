name: PR Check
on:
  pull_request:
    branches:
      - main
  # Runs on main too so PRs can restore main's dependency and test DB caches.
  push:
    branches:
      - main
jobs:
  backend-lint:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black==26.5.1
      - name: Lint with pylint
        run: |
          pylint .
      - name: Lint with flake8
        run: |
          flake8 .
      - name: Lint with black
        run: |
          black --check .
  bot-check:
    # The Discord bot (bot/) is a separate deployable; lint it and run its
    # stdlib unittest suite (button custom_id contract, /timer off the loop).
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bot
    env:
      DISCORD_BOT_TOKEN: ci-placeholder
      MINMATAR_API_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: bot/Pipfile.lock
      - name: Install dependencies
        run: |
          pip install pipenv flake8
          pipenv sync
      - name: Lint with flake8
        run: |
          flake8 .
      - name: Run tests
        run: |
          pipenv run python -m unittest discover -s tests -t .
  backend-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_NAME: .test-db/test_db.sqlite3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv sync --dev
      # Restore the newest migrated test DB, even one from before this
      # branch's migrations: --keepdb then applies only the new ones, instead
      # of all ~700 (about 4 minutes). ci_test_db.py discards the DB when a
      # migration it holds was renamed or edited. A Pipfile.lock change can
      # change third-party migrations, so it starts a fresh chain.
      - name: Restore migrated test database
        id: test-db
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/.test-db/test_db.sqlite3
            backend/.test-db/test_db.sqlite3.manifest.json
          key: test-db-${{ runner.os }}-py3.10-${{ hashFiles('backend/Pipfile.lock') }}-${{ hashFiles('backend/**/migrations/*.py') }}
          restore-keys: |
            test-db-${{ runner.os }}-py3.10-${{ hashFiles('backend/Pipfile.lock') }}-
      - name: Check cached test database
        run: python ci_test_db.py check "$TEST_DB_NAME"
      # Migration tests (tag "migration") run in backend-migration-tests.
      - name: Run tests
        run: |
          mkdir -p .test-db
          pipenv run coverage run manage.py test --settings=app.settings_test --testrunner="testrunner.Runner" --parallel auto --keepdb --noinput --exclude-tag migration
      - name: Record test database migrations
        if: always() && steps.test-db.outputs.cache-hit != 'true'
        run: python ci_test_db.py record "$TEST_DB_NAME"
      - name: Save migrated test database
        if: always() && steps.test-db.outputs.cache-hit != 'true' && hashFiles('backend/.test-db/test_db.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            backend/.test-db/test_db.sqlite3
            backend/.test-db/test_db.sqlite3.manifest.json
          key: ${{ steps.test-db.outputs.cache-primary-key }}
      - name: Combine coverage
        run: |
          pipenv run coverage combine
          pipenv run coverage json
      - name: Display test results
        run: cat testresults.txt
      - name: Write coverage summary
        run: python testsummary.py
      - name: Publish results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/testresults.txt
          retention-days: 1
  # Tests that drive MigrationExecutor re-render the whole migration graph
  # and take seconds each, so they run beside backend-check, not in it, and
  # on pull requests only when the PR adds or changes a migration.
  backend-migration-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_NAME: .test-db/test_db.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Find migration changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only HEAD^1 HEAD | grep -q '^backend/.*/migrations/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migrations changed; skipping migration tests."
          fi
      - if: steps.changes.outputs.run == 'true'
        name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock
      - if: steps.changes.outputs.run == 'true'
        name: Install dependencies
        run: |
          pip install pipenv
          pipenv sync --dev
      - if: steps.changes.outputs.run == 'true'
        name: Restore migrated test database
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/.test-db/test_db.sqlite3
            backend/.test-db/test_db.sqlite3.manifest.json
          key: test-db-${{ runner.os }}-py3.10-${{ hashFiles('backend/Pipfile.lock') }}-${{ hashFiles('backend/**/migrations/*.py') }}
          restore-keys: |
            test-db-${{ runner.os }}-py3.10-${{ hashFiles('backend/Pipfile.lock') }}-
      - if: steps.changes.outputs.run == 'true'
        name: Check cached test database
        run: python ci_test_db.py check "$TEST_DB_NAME"
      - if: steps.changes.outputs.run == 'true'
        name: Run migration tests
        run: |
          mkdir -p .test-db
          pipenv run python manage.py test --settings=app.settings_test --parallel auto --keepdb --noinput --tag migration
